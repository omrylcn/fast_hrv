[package]
name = "fast-hrv"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Fast, dependency-light heart rate variability (HRV) analysis from ECG: R-peaks, artifact correction, 39 time/frequency/nonlinear metrics"
license = "MIT OR Apache-2.0"
repository = "https://github.com/omrylcn/fast_hrv"
readme = "README.md"
keywords = ["hrv", "ecg", "heart-rate", "biosignal", "dsp"]
categories = ["science", "algorithms", "mathematics"]

[lib]
name = "fast_hrv"
crate-type = ["rlib", "cdylib"]

[features]
default = []
serde = ["dep:serde"]
parallel = ["dep:rayon"]
simd = []
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
ordered-float = "4.2"
serde_json = "1.0"
serde = { version = "1", features = ["derive"], optional = true }
rayon = { version = "1.10", optional = true }
pyo3 = { version = "0.22", features = ["extension-module"], optional = true }
numpy = { version = "0.22", optional = true }

[dev-dependencies]
approx = "0.5"
serde_json = "1.0"

